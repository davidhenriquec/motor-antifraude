server:
  port: 8084

spring:
  application:
    name: simulador
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Decisoes do topico 1 e do topico 3, visiveis aqui de proposito:
      acks: all                       # nenhum evento de fraude perdido, ao custo de ~10 ms
      properties:
        enable.idempotence: true      # elimina repeticao gerada pelo proprio produtor
        linger.ms: 5                  # lote com prazo maximo: vazao sem custo de latencia
        compression.type: lz4
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: simulador

simulador:
  topico: transacoes
  quantidade-de-clientes: 200000
  taxa-por-segundo: 50
  ligado: false

logging:
  level:
    br.com.antifraude: INFO
